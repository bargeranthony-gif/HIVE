[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-engine"
version = "0.1.0"
description = "A lightweight, evidence-driven software capability discovery and registry engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "HIVE Project"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright==1.25.2"]

[project.scripts]
hive = "hive.cli:main"

[tool.setuptools.packages.find]
include = ["hive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
