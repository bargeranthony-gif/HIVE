name: HIVE combined synthetic research CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hive-combined-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-offline-regression:
    name: Combined offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout exact review head without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify interpreter identity
        run: |
          python --version
          python3 --version
          python3 -c 'import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))'
      - name: Install test runner only
        run: python -m pip install 'pytest>=8,<9'
      - name: Run all inherited and combined synthetic tests and receipts
        run: bash scripts/verify_offline_review.sh
      - name: Independently rerun entire repository test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          HIVE_HOME: ${{ runner.temp }}/hive-combined-test
        run: python -m pytest -q tests --disable-warnings

# Evaluation-only public fork. No secrets, external financial source access,
# model deployment, brokerage integrations, trading or scheduled runs.
# A passing workflow verifies synthetic code behavior, not data rights or alpha.
